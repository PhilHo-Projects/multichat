name: Diagnose deploy SSH reachability

# Temporary. Delete once the deploy path is fixed.
on:
  push:
    branches:
      - philchat-auth

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the secret host and the known Hetzner IP
        env:
          DEPLOY_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          echo "Neither the secret's value nor any key material is printed below."

          echo "--- does the secret resolve, and to how many addresses? ---"
          getent ahostsv4 "$DEPLOY_HOST" | awk '{print $1}' | sort -u | wc -l

          echo "--- does the secret's value equal the known Hetzner IP? ---"
          if [ "$DEPLOY_HOST" = "95.217.6.255" ]; then echo "yes"; else echo "no"; fi

          echo "--- ssh-keyscan against the secret host ---"
          timeout 20 ssh-keyscan -T 15 "$DEPLOY_HOST" > /tmp/secret.keys 2>/tmp/secret.err
          echo "exit=$? keys=$(wc -l < /tmp/secret.keys)"
          sed -e "s/$DEPLOY_HOST/<HOST>/g" /tmp/secret.err | head -5

          echo "--- ssh-keyscan against the literal Hetzner IP ---"
          timeout 20 ssh-keyscan -T 15 95.217.6.255 > /tmp/ip.keys 2>/tmp/ip.err
          echo "exit=$? keys=$(wc -l < /tmp/ip.keys)"
          head -5 /tmp/ip.err

          echo "--- plain TCP reachability of the literal IP ---"
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/95.217.6.255/22' \
            && echo "port 22 open" || echo "port 22 unreachable"
          timeout 15 bash -c 'cat < /dev/null > /dev/tcp/95.217.6.255/443' \
            && echo "port 443 open" || echo "port 443 unreachable"
